<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard Phase 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1em;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background-color: #f5f5f5;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Leaderboard Phase 1</h1>
  <div id="error" class="error"></div>
  <table id="leaderboard"></table>

  <script>
    fetch('leaderboard_phase1.csv')  // change path if CSV is in a different folder
      .then(response => {
        if (!response.ok) {
          throw new Error("File not found or access denied");
        }
        return response.text();
      })
      .then(csv => {
        const rows = csv.trim().split('\n').map(row => row.split(','));
        const table = document.getElementById('leaderboard');

        rows.forEach((row, i) => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const el = document.createElement(i === 0 ? 'th' : 'td');
            el.textContent = cell;
            tr.appendChild(el);
          });
          table.appendChild(tr);
        });
      })
      .catch(err => {
        document.getElementById('error').textContent = "Error loading CSV: " + err.message;
        console.error(err);
      });
  </script>
</body>
</html>
